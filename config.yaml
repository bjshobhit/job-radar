# ----------------------------------------------------------------------------
# LOCATION FILTER: only surface jobs that are in India OR remote/India-eligible.
# A job is DROPPED only when it is clearly region-locked to a blocked region
# (e.g. "Remote - US") or clearly based in another country (e.g. "London, UK").
# Jobs with a blank/vague location are KEPT and tagged "unverified".
#   india_tokens    -> Indian cities/regions -> classified INDIA (star)
#   remote_tokens   -> words that signal remote work
#   global_tokens   -> "remote + global" -> India-eligible (star)
#   blocked_regions -> other countries/regions; drop unless India also present
#                      (India always wins). "us" is bare on purpose (word-bound).
# Edit these lists freely; matching is case-insensitive and word-boundary aware.
# ----------------------------------------------------------------------------
location:
  mode: india_or_remote
  india_tokens:
    - india
    - bengaluru
    - bangalore
    - mumbai
    - pune
    - hyderabad
    - chennai
    - gurugram
    - gurgaon
    - noida
    - delhi
    - ncr
    - kolkata
    - ahmedabad
    - jaipur
  remote_tokens:
    - remote
    - work from home
    - wfh
    - anywhere
  global_tokens:
    - worldwide
    - global
    - anywhere
  blocked_regions:
    - united states
    - usa
    - us
    - emea
    - europe
    - uk
    - united kingdom
    - canada
    - latam
    - singapore
    - dubai
    - germany
    - san francisco
    - new york
    - london

# ----------------------------------------------------------------------------
# EXPERIENCE CEILING: drop jobs that require MORE than this many years of
# experience. Parsed from the job title + description (where available:
# greenhouse, lever, amazon). Ranges use the lower bound ("3-5 years" needs 3);
# jobs with no detectable YOE requirement are kept. "Senior" titles are already
# excluded via exclude_keywords above. Comment out to disable.
# ----------------------------------------------------------------------------
max_years_experience: 3

# ----------------------------------------------------------------------------
# TAILORED RESUME: for each matching job, generate an ATS-optimized PDF resume
# from resume/base.yaml, tailored to the job description, and deliver it via
# Telegram (sendDocument with an ATS-score caption). Set enabled: false to fall
# back to plain text batch alerts.
#   experience_years   -> your real YOE (drives the JD experience match)
#   max_target_years   -> skip jobs asking for more than this (too senior)
#   max_resumes_per_run-> cap PDFs generated per run (spam + runtime guard)
# ----------------------------------------------------------------------------
resume:
  enabled: true
  experience_years: 2
  max_target_years: 6
  max_resumes_per_run: 10
