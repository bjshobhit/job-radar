# ----------------------------------------------------------------------------
# DISCOVERY: broad search across free job APIs (beyond your watchlist).
# Adzuna needs free keys (ADZUNA_APP_ID / ADZUNA_APP_KEY as GitHub Secrets);
# if not set, Adzuna is skipped automatically. The rest need NO key and pull
# from thousands of companies at once — keyword filters below narrow the flood.
# ----------------------------------------------------------------------------
discovery:
  enabled: true
  queries:
    - "backend engineer"
    - "software engineer backend"
    - "java backend"
    - "python backend"
  remotive_search: "backend"
  remoteok: true             # remoteok.com/api — global remote jobs
  arbeitnow: true            # arbeitnow.com — global, many remote
  jobicy_tags:               # jobicy.com remote jobs, one fetch per tag
    - backend
    - java
    - python
  himalayas: true            # himalayas.app remote jobs
  himalayas_limit: 50
  amazon: true               # amazon.jobs — big tech, strong India (SDE) coverage
  amazon_queries:
    - "backend engineer"
    - "software development engineer"
    - "java"
    - "python"
  netflix: true              # explore.jobs.netflix.net
  netflix_query: "backend"
  themuse:                   # themuse.com — company-rich, supports locations
    enabled: true
    pages: 3
    categories:
      - "Software Engineering"
    locations: []            # e.g. ["Bengaluru, India", "Flexible / Remote"]

# ----------------------------------------------------------------------------
# FILTERS (case-insensitive, word-boundary aware — "java" != "javascript").
# A job is sent only if its title matches an include keyword AND no exclude one.
# ----------------------------------------------------------------------------
include_keywords:
  - backend
  - back-end
  - back end
  - backend engineer
  - backend developer
  - software engineer
  - software development engineer
  - sde
  - sde-1
  - sde 1
  - sde-2
  - sde 2
  - sde ii
  - server
  - server-side
  - api engineer
  - platform engineer
  - distributed systems
  - microservices
  - systems engineer
  - application engineer
  - java
  - python
  - kotlin

exclude_keywords:
  - senior staff
  - senior
  - staff
  - principal
  - architect
  - lead
  - manager
  - director
  - head of
  - vp
  - vice president
  - founding
  - intern
  - internship
  - trainee
  - apprentice
  - frontend
  - front-end
  - front end
  - ui engineer
  - ux
  - ios
  - android
  - mobile
  - qa
  - sdet
  - test engineer
  - data scientist
  - data analyst
  - machine learning
  - ml engineer
  - support
  - sales
  - recruiter
  - designer
  - product manager
  - devops
  - sre
  - site reliability
  - salesforce
  - golang
  - go developer
  - rust
  - scala
  - c++
  - c#
  - .net
  - php
  - ruby
  - node
  - node.js
  - javascript
  - react

# Locations to flag with a star and (optionally) hard-filter on.
priority_locations:
  - gurugram
  - gurgaon
  - noida
  - delhi
  - ncr
  - remote

# If true, ONLY priority_locations pass. Default false = allow everywhere,
# just tag NCR/remote roles with a star.
strict_location: false

# ----------------------------------------------------------------------------
# EXPERIENCE CEILING: drop jobs that require MORE than this many years of
# experience. Parsed from the job title + description (where available:
# greenhouse, lever, amazon). Ranges use the lower bound ("3-5 years" needs 3);
# jobs with no detectable YOE requirement are kept. "Senior" titles are already
# excluded via exclude_keywords above. Comment out to disable.
# ----------------------------------------------------------------------------
max_years_experience: 3
