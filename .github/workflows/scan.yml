name: scan
on:
  schedule:
    # Off-peak minutes (not :00/:20/:40) — GitHub's scheduler is far more
    # reliable away from the congested top-of-interval boundaries.
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Never let two scans run at once — avoids racing pushes to seen.json.
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WeasyPrint system libraries
        # weasyprint renders the tailored-resume PDFs and needs pango/cairo/
        # gdk-pixbuf shared libs that aren't on the runner by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Persist seen state
        run: |
          git config user.name "bjshobhit"
          git config user.email "104783891+bjshobhit@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update seen state" || { echo "no changes"; exit 0; }
          # Rebase-and-retry: another run may have pushed while we worked.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main
          done
          echo "failed to push after retries"; exit 1
