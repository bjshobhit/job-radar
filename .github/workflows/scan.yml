name: scan
on:
  schedule:
    # Off-peak minutes (not :00/:20/:40) — GitHub's scheduler is far more
    # reliable away from the congested top-of-interval boundaries.
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Persist seen state
        run: |
          git config user.name "bjshobhit"
          git config user.email "104783891+bjshobhit@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update seen state" || echo "no changes"
          git push
